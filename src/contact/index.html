<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <link rel="stylesheet" href="../index.css">
    <link rel="stylesheet" href="contact.css">
</head>

<body>

    <div id="scrollbar-container">
        <div id="scrollbar-bg"></div>
    </div>

    <div class="border">
        <nav>
            <div class="traffic">
                <div class="t1"></div>
                <div class="t2"></div>
                <div class="t3"></div>
            </div>

            <div class="links">
                <a href="../index.html">Home</a>
                <a href="../about/index.html">About</a>
                <a href="#">Contact</a>
            </div>

            <div class="functions">
                <button onclick="toggleFullscreen()">⛶</button>
            </div>
        </nav>

        <section class="contact-section">
            <div class="header">
                <h1>Let's Connect</h1>
                <p>Whether you'd like to collaborate, have a project idea, or just want to chat about design and code,
                    I'd love to hear from you.</p>
            </div>

            <form action="#" method="post" class="contact-form">
                <div class="row">
                    <label>
                        <input type="text" name="name" placeholder="Name">
                    </label>

                    <label>
                        <input type="email" name="email" placeholder="Email">
                    </label>

                </div>

                <label>
                    <textarea name="message" rows="5" placeholder="Message"></textarea>
                </label>

                <button type="submit">Send</button>
            </form>

        </section>

        <footer>
            <span>Michael Leix</span>
            <span>(385)-391-6848</span>
            <span>Michaelleix@mail.weber.edu</span>
        </footer>
    </div>
</body>

<script src="../index.js"></script>

</html>
